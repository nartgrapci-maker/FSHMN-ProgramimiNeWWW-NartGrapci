<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Planifiko një pasdite me 20 euro</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip" href="#main">Kalo te përmbajtja</a>
    <header>
      <p>Programimi në WWW · Pikënisja</p>
      <h1>Planifiko një pasdite me 20 euro</h1>
    </header>
    <main id="main">
      <form id="forma" novalidate>
        <p>
          <label for="cmimi">Çmimi për person (€)</label>
          <input id="cmimi" type="number" min="0" step="any" />
        </p>
        <p>
          <label for="persona">Persona (1–5)</label>
          <input id="persona" type="number" min="1" max="5" step="1" />
        </p>
        <p>
          <label for="buxheti">Buxheti (€)</label>
          <input id="buxheti" type="number" min="0" step="any" value="20" />
        </p>
        <button type="submit">Llogarit</button>
      </form>
      <p id="rezultati" role="status"></p>
    </main>
    <footer>Shembull mësimor · Të dhëna të sajuara · Vetëm front end</footer>
    <script type="module" src="ui.js"></script>
  </body>
</html>
